# Dependencies allowed to run install/build scripts.
# pnpm 11+ blocks build scripts by default and fails CI installs with
# ERR_PNPM_IGNORED_BUILDS. `allowBuilds` (replaces the old onlyBuiltDependencies)
# maps each dependency to true (allowed) or false (blocked).
allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
